            .btn-daftar {
            display: block;
            width: 80%;
            margin: 15px auto;
            padding: 15px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.1rem;
            border-radius: 50px;
            text-align: center;
            position: relative; /* Wajib ada */
            overflow: hidden;
            color: #ffffff; /* Warna teks awal */
            background: #111;
            border: none;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 1; /* Membuat konteks tumpukan baru */
        }

        /* 1. Animasi Border Berputar */
        .btn-daftar::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, #eeff00, #8b8208, transparent 30%);
            animation: rotate-border 3s linear infinite;
            z-index: -2; /* Taruh di paling belakang */
        }

        /* 2. Lapisan Background Tengah */
        .btn-daftar::after {
            content: '';
            position: absolute;
            inset: 3px; /* Ketebalan border */
            background: #1a1a1a;
            border-radius: 50px;
            z-index: -1; /* Taruh di belakang teks, tapi di atas border putar */
            transition: 0.3s;
        }

        /* 3. Efek Hover */
        .btn-daftar:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 191, 0, 0.4);
        }

        .btn-daftar:hover::after {
            background: #222; /* Sedikit lebih terang saat di-hover */
        }

        .btn-daftar:hover {
            color: #f2ff00; /* Teks berubah warna jadi emas saat hover */
        }
        .btn-daftar span {
            position: relative;
            z-index: 5; /* Memaksa teks berada di lapisan paling atas */
            pointer-events: none; /* Agar klik tetap tembus ke tombol */
        }
        /* 1. Efek Background & Cahaya Panggung */
        .stage-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2c2c2c 0%, #000 100%);
            z-index: -1;
            overflow: hidden;
        }

        /* Sorot Lampu Bergerak */
        .beam {
            position: absolute;
            top: -20%;
            width: 300px;
            height: 150%;
            background: linear-gradient(to bottom, rgba(247, 0, 255, 0.2), transparent);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            filter: blur(30px);
            opacity: 0.6;
            animation: beamMove 8s infinite alternate ease-in-out;
        }

        .beam-left { left: -10%; transform-origin: top; }
        .beam-right { right: -10%; transform-origin: top; animation-delay: -4s; }

        /* Efek Debu Melayang */
        .dust {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#fff 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
            animation: dustFly 20s linear infinite;
        }

        /* 2. Styling Header & Welcome Text */
        h1 {

            text-shadow: 0 5px 15px rgba(242, 0, 255, 0.2);

            border: 1px solid rgba(255, 0, 230, 0.2);

        .btn-daftar::after {

        /* Memastikan Teks Tombol di Depan */
